[project]
name = "banhammerbot"
version = "0.1.0"
description = "Telegram spam moderation using Jev multimodal decisions"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29", "python-dotenv>=1.1,<2"]

[project.scripts]
banhammerbot = "banhammerbot.__main__:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff>=0.14,<1"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
